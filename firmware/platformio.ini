; Cyber Chaukidaar sentry node firmware v2
; Build one of the environments below:
;   pio run -e wifi  -t upload     (default: WiFi uplink straight to the server)
;   pio run -e ble   -t upload     (BLE uplink via gateway/ble_gateway.py on the Raspberry Pi)
;   pio run -e lora  -t upload     (LoRa SX127x uplink via gateway/lora_gateway.py)
;
; Per-node settings (node id, WiFi credentials, server URL) can be typed over the
; serial console after flashing — see docs/firmware.md — so one binary serves every node.

[platformio]
default_envs = wifi

[env]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wno-unused-variable
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

[env:wifi]
build_flags =
    ${env.build_flags}
    -DTRANSPORT_WIFI=1

[env:ble]
build_flags =
    ${env.build_flags}
    -DTRANSPORT_BLE=1
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino @ ^1.4.2

[env:lora]
build_flags =
    ${env.build_flags}
    -DTRANSPORT_LORA=1
lib_deps =
    ${env.lib_deps}
    sandeepmistry/LoRa @ ^0.8.0
