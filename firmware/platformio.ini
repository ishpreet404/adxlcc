; Cyber Chaukidaar sentry node firmware v2.1
;   pio run -e s3    -t upload     ESP32-S3, ADXL345 x2 on SPI, LD2420 radar, WS2812 ring, buzzer  (your hardware)
;   pio run -e wifi  -t upload     classic ESP32 DevKit, ADXL345 x2 on I2C, LD2410 radar
;   pio run -e ble   -t upload     classic ESP32, BLE uplink via gateway/ble_gateway.py
;   pio run -e lora  -t upload     classic ESP32, LoRa SX127x uplink via gateway/lora_gateway.py
;
; Per-node settings (node id, WiFi credentials, server URL) can also be typed over the
; serial console after flashing — see docs/firmware.md.

[platformio]
default_envs = s3

[env]
platform = espressif32@6.7.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wno-unused-variable
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit NeoPixel @ ^1.12.3

[env:s3]
board = esp32-s3-devkitc-1
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    -DBOARD_S3=1
    -DTRANSPORT_WIFI=1
    ; Board connected through the S3's native USB port (USB JTAG/serial, /dev/cu.usbmodem*):
    ; route Serial to it. Set both to 0 if you use the external UART/COM port instead.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_rts = 0
monitor_dtr = 0

[env:wifi]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DTRANSPORT_WIFI=1

[env:ble]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DTRANSPORT_BLE=1
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino @ ^1.4.2

[env:lora]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DTRANSPORT_LORA=1
lib_deps =
    ${env.lib_deps}
    sandeepmistry/LoRa @ ^0.8.0
